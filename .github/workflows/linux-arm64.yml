name: Linux arm64 CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-26.04-arm

#    defaults:
