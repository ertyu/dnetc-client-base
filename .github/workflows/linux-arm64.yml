name: Linux arm64 CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    timeout-minutes: 20

    runs-on: ubuntu-26.04-arm

    steps:
    - uses: actions/checkout@v7
#    - name: Install dependencies
#      run: sudo apt-get install yasm wget
#    - name: Install ispc
#      working-directory: /tmp
#      run: |
#        wget https://github.com/ispc/ispc/releases/download/v1.13.0/ispc-v1.13.0-linux.tar.gz
#        tar xvzf ispc-v1.13.0-linux.tar.gz
#        sudo install ispc-v1.13.0-linux/bin/ispc /usr/bin/
    - name: configure
      env:
        SHELL: /bin/sh
      run: ./configure linux-arm64
    - name: make
      run: make
    - name: test
      run: ./dnetc -test
    - name: cpuinfo
      run: ./dnetc -cpuinfo
    - name: bench
      run: ./dnetc -bench
    - name: cpu
      run: cat /proc/cpuinfo
      
